<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portfólio SENAI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">
    <main class="caixa-login">
        <div class="login-logo">GB</div>
        <h1>Bem-vindo</h1>
        <p class="login-subtitulo">Acesse o portfólio com suas credenciais</p>

        <form id="form-login" onsubmit="logar(event)">
            <div class="form-group">
                <label for="login">Usuário</label>
                <input type="email" id="login" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-login">Entrar</button>

            <p id="erro-login" class="erro-login"></p>
        </form>

        <p class="login-rodape">
            <a href="#">Esqueceu a senha?</a>
        </p>
    </main>

    <script src="login.js"></script>
</body>

</html>
